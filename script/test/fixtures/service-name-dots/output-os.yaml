---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: api-gateway
  name: api-gateway
spec:
  ports:
    - name: "9090"
      port: 9090
      targetPort: 90
  selector:
    io.kompose.service: api-gateway

---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: web-server
  name: web-server
spec:
  ports:
    - name: "8080"
      port: 8080
      targetPort: 80
  selector:
    io.kompose.service: web-server

---
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: api-gateway
  name: api-gateway
spec:
  replicas: 1
  selector:
    io.kompose.service: api-gateway
  template:
    metadata:
      labels:
        io.kompose.service: api-gateway
    spec:
      containers:
        - image: ' '
          name: api-gateway
          ports:
            - containerPort: 90
              protocol: TCP
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - api-gateway
        from:
          kind: ImageStreamTag
          name: api-gateway:1.27
      type: ImageChange

---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  labels:
    io.kompose.service: api-gateway
  name: api-gateway
spec:
  lookupPolicy:
    local: false
  tags:
    - from:
        kind: DockerImage
        name: nginx:1.27
      name: "1.27"
      referencePolicy:
        type: ""

---
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: web-server
  name: web-server
spec:
  replicas: 1
  selector:
    io.kompose.service: web-server
  template:
    metadata:
      labels:
        io.kompose.service: web-server
    spec:
      containers:
        - image: ' '
          name: web-server
          ports:
            - containerPort: 80
              protocol: TCP
      restartPolicy: Always
  test: false
  triggers:
    - type: ConfigChange
    - imageChangeParams:
        automatic: true
        containerNames:
          - web-server
        from:
          kind: ImageStreamTag
          name: web-server:1.27
      type: ImageChange

---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  labels:
    io.kompose.service: web-server
  name: web-server
spec:
  lookupPolicy:
    local: false
  tags:
    - from:
        kind: DockerImage
        name: nginx:1.27
      name: "1.27"
      referencePolicy:
        type: ""

